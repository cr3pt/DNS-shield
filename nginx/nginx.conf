# Worker processes (which handle the proxied traffic) run unprivileged; only
# the master, which binds ports 80/443 and reads the certificates, stays root.
user dnsshield dnsshield;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
