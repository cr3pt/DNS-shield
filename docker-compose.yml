services:
  dns-shield:
    build: .
    image: dns-shield:latest
    container_name: dns-shield
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "3000:3000/tcp"
    volumes:
      - ./data:/data
    # DNS-shield only ever talks to the upstream resolvers and blocklist
    # URLs configured in ./data/config.db, plus a threat-intel lookup
    # (VirusTotal/AbuseIPDB/OTX) when you click "Enrich" - and only for a
    # service you've configured an API key for. Nothing else, ever.
