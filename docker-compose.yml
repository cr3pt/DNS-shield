services:
  dns-shield:
    build: .
    image: dns-shield:latest
    container_name: dns-shield
    restart: unless-stopped
    network_mode: host
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/data
      - ./data/certs:/etc/letsencrypt
