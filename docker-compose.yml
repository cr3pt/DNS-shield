services:
  dns-shield:
    build: .
    image: dns-shield:latest
    container_name: dns-shield
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "3000:3000/tcp"
    volumes:
      - ./data:/data
    # DNS-shield only ever talks to the upstream resolvers and blocklist
    # URLs configured in ./data/config.db, plus (when you click "Enrich")
    # a self-hosted reputation service you point it at, and/or VirusTotal/
    # AbuseIPDB/OTX - but only once you've both saved a key for one AND
    # turned on "Enable public lookups" in Settings, off by default.
    # Nothing else, ever.
