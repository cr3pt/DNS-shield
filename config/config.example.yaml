dns:
  listen_address: "0.0.0.0"
  listen_port: 53
  upstreams:
    - "1.1.1.1:53"
    - "9.9.9.9:53"
  upstream_timeout_seconds: 3.0
  upstream_strategy: "in_order"
  upstream_stats_window_minutes: 15
  query_case_randomization_enabled: false
  block_mode: "nxdomain"
  blocked_ipv4: "0.0.0.0"
  blocked_ipv6: "::"
  block_page_enabled: false
  block_page_port: 80
  block_ipv6: false
  block_non_latin: false
  safe_search_enabled: false
  dnssec_enabled: false
  dnssec_cache_seconds: 3600
  typosquat_enabled: false
  typosquat_max_distance: 2
  typosquat_cooldown_minutes: 30
  typosquat_action: "alert"
  typosquat_redirect_ip: ""
  typosquat_extra_domains: []
  regex_denylist_enabled: false
  cache_enabled: true
  cache_max_entries: 10000
  cache_min_ttl_seconds: 0
  cache_max_ttl_seconds: 3600
  cache_serve_stale_enabled: true
  cache_stale_grace_seconds: 3600
  cache_prefetch_enabled: false
  cache_prefetch_before_expiry_seconds: 10
  cache_prefetch_min_hits: 2
  resolve_client_names: false
  client_name_resolver: ""
  client_name_cache_seconds: 3600
  dot_enabled: false
  dot_port: 853
  rebinding_protection_enabled: false
  rebinding_action: "alert"
  rebinding_exempt_domains: []
  local_tld_alert_enabled: false
  local_tld_list: ["local", "lan", "home", "internal", "corp", "home.arpa"]
  local_tld_cooldown_minutes: 30

blocklists:
  refresh_interval_hours: 24
  sources:
    - name: "StevenBlack Unified Hosts"
      url: "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"
      enabled: true
  allow_sources: []

allowlist: []

denylist: []

denylist_regex: []

blocked_clients: []

blocked_answer_ips: []

blocked_answer_ip_sources: []

dns_rewrites: []

domain_upstreams: []

client_groups: []

web:
  listen_address: "0.0.0.0"
  listen_port: 3000
  theme: "navy"
  https_enabled: false
  https_cert_path: ""
  https_key_path: ""
  login_max_attempts: 5
  login_lockout_minutes: 15

users: []

sso:
  enabled: false
  issuer: ""
  client_id: ""
  client_secret: ""
  scopes: "openid email profile"
  button_label: "Single Sign-On"
  username_claim: "preferred_username"
  auto_provision: true
  default_role: "user"

logging:
  level: "INFO"
  retention_days: 30
  ignored_domains: []
  ignored_clients: []

enrichment:
  public_enabled: false
  virustotal_api_key: ""
  abuseipdb_api_key: ""
  otx_api_key: ""
  greynoise_api_key: ""
  shodan_api_key: ""
  urlhaus_api_key: ""
  rdap_enabled: false
  crtsh_enabled: false
  ipinfo_enabled: false
  ipinfo_api_key: ""
  ai_enabled: false
  ai_api_key: ""
  local_enabled: false
  local_url: ""
  local_api_key: ""
  alert_enabled: true
  alert_min_severity: "medium"
  auto_enrich_enabled: false
  auto_enrich_interval_seconds: 30
  auto_enrich_max_per_check: 5

anomaly:
  enabled: false
  check_interval_minutes: 5
  window_minutes: 15
  min_queries: 20
  blocked_ratio_threshold: 0.5
  domain_burst_threshold: 50
  domain_burst_min_label_length: 10
  domain_burst_min_entropy: 3.3
  domain_burst_entropy_fraction: 0.5
  blocked_domain_burst_threshold: 15
  dns_tunneling_threshold: 30
  dns_tunneling_min_label_length: 20
  dns_tunneling_min_entropy: 3.0
  ptr_scan_threshold: 15
  cooldown_minutes: 60
  excluded_domains: []

alert_rules:
  check_interval_seconds: 15
  cooldown_minutes: 15
  domains: []
  sources: []

notifications:
  email:
    enabled: false
    smtp_host: ""
    smtp_port: 587
    smtp_security: "starttls"
    smtp_username: ""
    smtp_password: ""
    from_address: ""
    to_addresses: []
    min_severity: "medium"
  webhooks: []
